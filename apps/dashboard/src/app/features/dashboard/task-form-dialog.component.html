<div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
    (click)="close.emit()"
>
    <div
        class="w-full max-w-md rounded-lg bg-white p-6 shadow-lg dark:bg-slate-800"
        (click)="$event.stopPropagation()"
    >
        <h2
            class="mb-4 text-lg font-semibold text-slate-900 dark:text-slate-100"
        >
            {{ isEditing ? 'Edit task' : 'New task' }}
        </h2>

        <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
                <label
                    for="title"
                    class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
                    >Title</label
                >
                <input
                    id="title"
                    formControlName="title"
                    autofocus
                    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100"
                />
            </div>

            <div class="mb-3">
                <label
                    for="description"
                    class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
                    >Description</label
                >
                <textarea
                    id="description"
                    formControlName="description"
                    rows="3"
                    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100"
                ></textarea>
            </div>

            <div class="mb-4 grid grid-cols-2 gap-3">
                <div>
                    <label
                        for="category"
                        class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
                        >Category</label
                    >
                    <select
                        id="category"
                        formControlName="category"
                        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100"
                    >
                        @for (category of categories; track category) {
                            <option [value]="category">{{ category }}</option>
                        }
                    </select>
                </div>
                <div>
                    <label
                        for="status"
                        class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
                        >Status</label
                    >
                    <select
                        id="status"
                        formControlName="status"
                        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100"
                    >
                        @for (status of statuses; track status) {
                            <option [value]="status">{{ status }}</option>
                        }
                    </select>
                </div>
            </div>

            <div class="flex justify-end gap-2">
                <button
                    type="button"
                    (click)="close.emit()"
                    class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"
                >
                    Cancel
                </button>
                <button
                    type="submit"
                    class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-500"
                >
                    {{ isEditing ? 'Save changes' : 'Create task' }}
                </button>
            </div>
        </form>
    </div>
</div>
