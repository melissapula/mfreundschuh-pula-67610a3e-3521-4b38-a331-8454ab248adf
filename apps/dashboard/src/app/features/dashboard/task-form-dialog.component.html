<!--
    Backdrop click-to-dismiss is a mouse-only convenience; the Escape key
    handler and the Cancel button below already give keyboard users an
    equivalent way to close, so this div isn't made focusable/keyboard-
    operable itself.
-->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
    (click)="requestDismiss()"
>
    <!--
        This click handler only stops propagation to the backdrop above; it
        doesn't itself perform an action, so no keyboard equivalent applies.
        cdkTrapFocus keeps Tab cycling inside the panel while it's open, and
        with autoCapture also moves focus to the first field on open and
        back to whatever triggered the dialog when it closes.
    -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
    <div
        class="w-full max-w-md rounded-lg bg-white p-6 shadow-lg dark:bg-slate-800"
        [class.shake]="blockedDismiss()"
        role="dialog"
        aria-modal="true"
        aria-labelledby="task-dialog-title"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
        (click)="$event.stopPropagation()"
    >
        <h2
            id="task-dialog-title"
            class="mb-4 text-lg font-semibold text-slate-900 dark:text-slate-100"
        >
            {{ isEditing ? 'Edit task' : 'New task' }}
        </h2>

        @if (error) {
            <p
                class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-950 dark:text-red-300"
            >
                {{ error }}
            </p>
        }

        <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
                <label
                    for="title"
                    class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
                    >Title</label
                >
                <input
                    id="title"
                    formControlName="title"
                    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100"
                />
            </div>

            <div class="mb-3">
                <label
                    for="description"
                    class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
                    >Description</label
                >
                <textarea
                    id="description"
                    formControlName="description"
                    rows="3"
                    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100"
                ></textarea>
            </div>

            <div class="mb-4 grid grid-cols-2 gap-3">
                <div>
                    <label
                        for="category"
                        class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
                        >Category</label
                    >
                    <select
                        id="category"
                        formControlName="category"
                        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100"
                    >
                        @for (category of categories; track category) {
                            <option [value]="category">{{ category }}</option>
                        }
                    </select>
                </div>
                <div>
                    <label
                        for="status"
                        class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
                        >Status</label
                    >
                    <select
                        id="status"
                        formControlName="status"
                        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100"
                    >
                        @for (status of statuses; track status) {
                            <option [value]="status">{{ status }}</option>
                        }
                    </select>
                </div>
            </div>

            <div class="flex items-center justify-between gap-2">
                <!--
                    The real feedback channel for a blocked Escape/backdrop
                    dismiss: unlike the shake below, this doesn't depend on
                    prefers-reduced-motion or on sight at all, and — because
                    it tracks form.dirty directly rather than a one-shot
                    flash — it's already visible before a dismiss is even
                    attempted, and a second blocked attempt isn't a silent
                    no-op just because the first one is still animating.
                -->
                <span aria-live="polite">
                    @if (form.dirty) {
                        <span
                            class="text-xs text-amber-600 dark:text-amber-400"
                        >
                            Unsaved changes
                        </span>
                    }
                </span>
                <div class="flex gap-2">
                    <button
                        type="button"
                        (click)="closed.emit()"
                        class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"
                    >
                        Cancel
                    </button>
                    <button
                        type="submit"
                        class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-500"
                    >
                        {{ isEditing ? 'Save changes' : 'Create task' }}
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
