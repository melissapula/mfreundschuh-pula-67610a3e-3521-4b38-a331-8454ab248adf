<div
  cdkDrag
  [cdkDragData]="task"
  class="group cursor-grab rounded-md border border-slate-200 bg-white p-3 shadow-sm active:cursor-grabbing dark:border-slate-700 dark:bg-slate-800"
>
  <div class="mb-2 flex items-start justify-between gap-2">
    <h3 class="text-sm font-medium text-slate-900 dark:text-slate-100">{{ task.title }}</h3>
    <span class="shrink-0 rounded px-1.5 py-0.5 text-[10px] font-medium uppercase" [ngClass]="categoryClasses[task.category]">
      {{ task.category }}
    </span>
  </div>

  @if (task.description) {
    <p class="mb-2 text-xs text-slate-500 dark:text-slate-400">{{ task.description }}</p>
  }

  @if (canMutate) {
    <div class="flex gap-2 opacity-0 transition-opacity group-hover:opacity-100">
      <button
        type="button"
        (click)="edit.emit(task)"
        class="text-xs font-medium text-indigo-600 hover:underline dark:text-indigo-400"
      >
        Edit
      </button>
      <button
        type="button"
        (click)="remove.emit(task)"
        class="text-xs font-medium text-red-600 hover:underline dark:text-red-400"
      >
        Delete
      </button>
    </div>
  }
</div>
