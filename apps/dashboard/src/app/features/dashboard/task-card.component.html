<div
  cdkDrag
  [cdkDragDisabled]="!canMutate"
  [cdkDragData]="task"
  class="group rounded-md border border-slate-200 bg-white p-3 shadow-sm dark:border-slate-700 dark:bg-slate-800"
  [class.cursor-grab]="canMutate"
  [class.active:cursor-grabbing]="canMutate"
>
  <div class="mb-2 flex items-start justify-between gap-2">
    <h3 class="text-sm font-medium text-slate-900 dark:text-slate-100">{{ task.title }}</h3>
    <span class="shrink-0 rounded px-1.5 py-0.5 text-[10px] font-medium uppercase" [ngClass]="categoryClasses[task.category]">
      {{ task.category }}
    </span>
  </div>

  @if (task.description) {
    <p class="mb-2 text-xs text-slate-500 dark:text-slate-400">{{ task.description }}</p>
  }

  @if (canMutate) {
    <div
      class="flex items-center gap-2 transition-opacity"
      [class.opacity-0]="!confirmingDelete()"
      [class.group-hover:opacity-100]="!confirmingDelete()"
    >
      <button
        type="button"
        (click)="edit.emit(task)"
        class="text-xs font-medium text-indigo-600 hover:underline dark:text-indigo-400"
      >
        Edit
      </button>
      <button
        type="button"
        (click)="onDeleteClick()"
        class="text-xs font-medium hover:underline"
        [class.text-red-600]="!confirmingDelete()"
        [class.dark:text-red-400]="!confirmingDelete()"
        [class.text-white]="confirmingDelete()"
        [class.bg-red-600]="confirmingDelete()"
        [class.rounded]="confirmingDelete()"
        [class.px-1.5]="confirmingDelete()"
      >
        {{ confirmingDelete() ? 'Confirm delete?' : 'Delete' }}
      </button>
    </div>
  }
</div>
